<!doctype html>
<html><head><meta charset="utf-8"><style>
  * {{ margin: 0; padding: 0; box-sizing: border-box; }}
  body {{ width: 1920px; height: 1080px; overflow: hidden; background: {wall}; display: flex;
          font-family: "PingFang SC", "Helvetica Neue", sans-serif; color: #1d2433; }}
  .art {{ flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 70px 40px 70px 70px; gap: 26px; }}
  .art img {{ max-width: 100%; min-height: 0; flex: 0 1 auto; box-shadow: 0 14px 44px rgba(0,0,0,.28); }}
  .cap {{ flex: none; max-width: 860px; text-align: center; color: #3c4353; }}
  .cap .t {{ font-family: Georgia, "Songti SC", serif; font-style: italic; font-size: 26px; color: #1d2433; }}
  .cap .a {{ font-size: 19px; color: #5b6272; margin-top: 4px; }}
  .cap .n {{ font-size: 20px; line-height: 1.6; margin-top: 12px; }}
  .card {{ width: 470px; margin: 70px 70px 70px 0; padding: 42px 40px; background: rgba(252, 250, 246, 0.94);
          display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 34px rgba(0,0,0,.12); }}
  .serif {{ font-family: Georgia, "Songti SC", serif; }}
  .weekday {{ font-size: 26px; letter-spacing: 6px; color: #b5563a; }}
  .date {{ font-size: 72px; line-height: 1.1; margin-top: 6px; }}
  .wx {{ margin-top: 20px; display: flex; align-items: baseline; gap: 18px; }}
  .wx b {{ font: 400 56px Georgia, serif; }}
  .wx span {{ font-size: 22px; color: #5b6272; }}
  h2 {{ font-size: 20px; letter-spacing: 4px; color: #1f3a5f; font-weight: 500; margin-top: 24px;
        padding-top: 18px; border-top: 1px solid #1d243326; }}
  ul {{ list-style: none; margin-top: 10px; }}
  .events {{ min-height: 0; flex: 0 1 auto; overflow: hidden; }}
  li {{ font-size: 23px; line-height: 1.3; padding: 5px 0; display: flex; gap: 18px; }}
  li .t {{ width: 70px; flex: none; color: #b5563a; font-family: Georgia, serif; font-size: 21px; padding-top: 2px; }}
  li span:last-child {{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }}
  li.done {{ color: #1d243366; }} li.done .t {{ color: #b5563a66; }}
  .more, .empty {{ font-size: 24px; color: #5b6272; padding: 7px 0; }}
  .foot {{ margin-top: auto; flex: none; font-size: 17px; color: #5b6272; padding-top: 20px; }}
  .rem {{ font-size: 20px; line-height: 1.5; color: #1d2433; padding: 10px 0 0 14px; border-left: 3px solid #b5563a;
         margin-bottom: 10px; }}
</style></head><body>
<div class="art">
  <img src="{art}">
  <div class="cap"><div class="t">{title}</div><div class="a">{artist}</div><div class="n">{note}</div></div>
</div>
<div class="card">
  <div class="weekday">{weekday}</div>
  <div class="date serif">{date}</div>
  {weather}
  <div class="events">{sections}</div>
  <div class="foot">{reminders}{updated}</div>
</div>
</body></html>
